<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 378" role="img" aria-label="Approval writes policy, then config; any failure leaves the app pending" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13">
