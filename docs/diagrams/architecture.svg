<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 402" role="img" aria-label="The coordinator writes NetBird policy and Caddy config; traffic never touches it" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13">
  <style>
    .ink{fill:#1f2328}.quiet{fill:#656d76}.edge{stroke:#8c959f}.grid{stroke:#d0d7de}
    .accentFill{fill:#0969da;fill-opacity:.12}.accentStroke{stroke:#0969da}
    @media (prefers-color-scheme: dark){.ink{fill:#e6edf3}.quiet{fill:#8d96a0}.edge{stroke:#6e7681}.grid{stroke:#30363d}.accentFill{fill:#58a6ff;fill-opacity:.15}.accentStroke{stroke:#58a6ff}}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs>
  <text x="24" y="28" font-size="15" font-weight="600" class="ink">The coordinator writes NetBird policy and Caddy config; traffic never touches it</text>
  <g fill="none" class="edge" stroke-width="1.25" marker-end="url(#a)">
    <path d="M184 84H300"/><path d="M460 84H576"/><path d="M112 222V150H340V108"/><path d="M184 246H200"/><path d="M344 246H516"/><path d="M618 170V140H656V108"/><path d="M104 330V308H272V286"/>
  </g>
  <rect x="24" y="60" width="160" height="48" rx="8" fill="none" class="edge" stroke-width="1.25"/><text x="104" y="88" text-anchor="middle" font-weight="600" class="ink">OIDC IdP</text>
  <rect x="300" y="60" width="160" height="48" rx="8" class="accentFill accentStroke" stroke-width="2"/><text x="380" y="88" text-anchor="middle" font-weight="600" class="ink">Coordinator</text>
  <rect x="576" y="60" width="160" height="48" rx="8" fill="none" class="edge" stroke-width="1.25"/><text x="656" y="88" text-anchor="middle" font-weight="600" class="ink">NetBird management</text>
  <rect x="24" y="170" width="336" height="116" rx="8" fill="none" class="grid" stroke-width="1.25" stroke-dasharray="4 4"/>
  <text x="128" y="194" font-size="12.5" font-weight="600" class="ink">Caddy node · per site</text>
  <rect x="40" y="222" width="144" height="48" rx="8" class="accentFill accentStroke" stroke-width="2"/><text x="112" y="250" text-anchor="middle" font-weight="600" class="ink">Reconciler</text>
  <rect x="200" y="222" width="144" height="48" rx="8" fill="none" class="edge" stroke-width="1.25"/><text x="272" y="250" text-anchor="middle" font-weight="600" class="ink">Caddy</text>
  <rect x="500" y="170" width="236" height="116" rx="8" fill="none" class="grid" stroke-width="1.25" stroke-dasharray="4 4"/>
  <text x="516" y="194" font-size="12.5" font-weight="600" class="ink">App host · peer · own group</text>
  <rect x="516" y="222" width="204" height="48" rx="8" fill="none" class="edge" stroke-width="1.25"/><text x="618" y="250" text-anchor="middle" font-weight="600" class="ink">App, listening on wt0</text>
  <rect x="24" y="330" width="160" height="48" rx="8" fill="none" class="edge" stroke-width="1.25"/><text x="104" y="358" text-anchor="middle" font-weight="600" class="ink">Users &amp; agents</text>
  <text x="242" y="76" text-anchor="middle" font-size="11.5" class="quiet">verifies OIDC tokens</text>
  <text x="518" y="76" text-anchor="middle" font-size="11.5" class="quiet">writes policies, reads peers</text>
  <text x="226" y="144" text-anchor="middle" font-size="11.5" class="quiet">pulls desired state, reports health</text>
  <text x="192" y="212" text-anchor="middle" font-size="11.5" class="quiet">admin API, localhost</text>
  <text x="430" y="238" text-anchor="middle" font-size="11.5" class="quiet">wt0 · policy-gated</text>
  <text x="610" y="160" text-anchor="end" font-size="11.5" class="quiet">enrolls with setup key</text>
  <text x="188" y="300" text-anchor="middle" font-size="11.5" class="quiet">HTTPS</text>
</svg>
